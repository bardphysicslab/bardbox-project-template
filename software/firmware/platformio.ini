[platformio]
default_envs = feather_s3

; Supported board: Adafruit Feather ESP32-S3, 8 MiB flash, no PSRAM.
; The default environment fails to build until FIRMWARE_VERSION is set in
; src/main.cpp ("Please set FIRMWARE_VERSION in main.cpp.").
[env:feather_s3]
platform = espressif32
board = bardbox_feather_s3_8mb_dual
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_bardbox_8mb_ota.csv
; Libraries compile separately: make project config visible to every module,
; not just src/main.cpp. This also tracks config.h for dependency rebuilds.
build_flags = -Iinclude

; Test build only: supplies an explicit, clearly non-production version.
[env:feather_s3_m1_test]
extends = env:feather_s3
build_flags = ${env:feather_s3.build_flags}
  -DFIRMWARE_VERSION=\"0.0.0-m1-test\"

; Synthetic 42 example, still no credentials: configure ignored include/config.h.
; Builds an image only; uploading requires a separate operator action.
[env:feather_s3_wifi42_test]
extends = env:feather_s3
build_flags = ${env:feather_s3.build_flags}
  -DFIRMWARE_VERSION=\"0.0.0-wifi42-test\"
build_src_filter = -<*> +<../examples/wifi42/main.cpp>
